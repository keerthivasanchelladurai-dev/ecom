{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="auth-page">
    <div class="auth-card fade-in">
        <h2>Welcome Back</h2>
        <p class="auth-subtitle">Sign in to your ShopVerse account</p>

        <form method="POST" action="{{ url_for('auth.login') }}">
            <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="you@example.com" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
            </div>

            <div class="form-group" style="display:flex; align-items:center; justify-content:space-between;">
                <label class="form-check">
                    <input type="checkbox" name="remember"> <span style="font-size:0.85rem; color:var(--text-secondary)">Remember me</span>
                </label>
                <a href="{{ url_for('auth.reset_password') }}" style="font-size:0.85rem;">Forgot password?</a>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg">Sign In</button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="{{ url_for('auth.register') }}">Create one</a>
        </div>
    </div>
</div>
{% endblock %}
